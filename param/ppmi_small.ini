# A small spec that runs end to end locally in a couple of minutes:
# 50 Mpc/h box, 64^3 survey grid, 256^3 zoom region. Uses the analytic
# Eisenstein & Hu transfer function, so no external camb.dat is needed.
# `ppmi validate param/ppmi_small.ini` passes; see README.md for the run command.

[meta]
name = demo

[cosmology]
Omega_m = 0.3099
Omega_b = 0.0489
Omega_L = 0.6901
H0 = 67.74
sigma_8 = 0.8159
nspec = 0.9667
transfer = eisenstein

[box]
boxlength = 50.0
levelmin = 6

[random]
seed_levelmin = 12345
cubesize = 32

[survey]
zstart = 50.0
levelmax = 6

[peakpatch]
ntile = 1
nbuff = 8
global_redshift = 0.0
Rsmooth_max = 10.0
ievol = 0
num_redshifts = 1
cen = 0.0,0.0,0.0

[zoom]
levelmax = 8
padding = 8
extent_factor = 3.0
region = box

[run]
ranks = 1

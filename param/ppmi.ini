# ppmi run specification: the single source of truth for a pipeline run.
#
# `ppmi validate param/ppmi.ini` checks every invariant. Both MUSIC's .conf and
# PeakPatch's parameters.ini are generated from this file; nothing here is
# hand-copied into either code. See plan/01_MACRO_PLAN.md P2-T4 and
# include/ppmi/spec.hpp for the contract.
#
# This example is a small, valid survey configuration. The grid pairing rule
# 2^levelmin == nsub*ntile is satisfied: levelmin=8 -> 256, and
# nsub*ntile = (nmesh - 2*nbuff)*ntile = 256 for ntile=1, nbuff=16.

[meta]
name = example_survey

[cosmology]
Omega_m = 0.3099
Omega_b = 0.0489
Omega_L = 0.6901
H0 = 67.74
sigma_8 = 0.8159
nspec = 0.9667
transfer = camb_file
transfer_file = camb.dat

[box]
boxlength = 100.0
levelmin = 8

[random]
seed_levelmin = 12345
cubesize = 32

[survey]
zstart = 50.0
levelmax = 8

[peakpatch]
ntile = 1
nbuff = 16
global_redshift = 20.0
Rsmooth_max = 20.0
ievol = 0
num_redshifts = 1
cen = 0.0,0.0,0.0

[zoom]
levelmax = 11
padding = 8
extent_factor = 3.0
region = box

[run]
ranks = 4
